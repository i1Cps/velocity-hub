[project]
name = "velocity-mjlab"
version = "0.1.0"
description = "Reinforcement learning environments for training bipeds and quadrupeds to follow velocity commands using mjlab"
requires-python = ">=3.12"
dependencies = [
    "better-actuator-models==1.0.1",
    "mjlab==1.4.0",
    "mujoco==3.8.0",
    "mujoco-warp==3.8.0.3",
    "warp-lang==1.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasks", "scripts"]

[project.scripts]
train = "scripts.train:main"
play = "scripts.play:main"

[project.entry-points."mjlab.tasks"]
velocity_mjlab = "tasks"
